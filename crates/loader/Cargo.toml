[package]
name              = "phoenix-loader"
description       = "The injected library, a constructor that starts phoenix inside the host"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = [ "cdylib" ]
name       = "phoenix"

[dependencies]
log             = { workspace = true }
phoenix-runtime = { workspace = true }

[target."cfg(unix)".dependencies]
libc         = { workspace = true }
misstep      = { workspace = true }
phoenix-sigs = { workspace = true }
serde_json   = { workspace = true }
zip          = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
phoenix-runtime-mobile = { workspace = true }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
phoenix-runtime-desktop = { workspace = true }

[lints]
workspace = true
